<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bidar Pickup Plan</title>
<style>
/* Layout: day sections, each pickup a compact row-card; contacts as a searchable A-Z list below. */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1d2420; --muted:#5d675f; --line:#dfe3dc;
  --accent:#1f6b52; --accent-soft:#e1efe8; --warn:#9a5a00; --warn-soft:#fbefd9;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121712; --surface:#1b221c; --fg:#e8ede7; --muted:#9aa69b; --line:#2c372d;
  --accent:#6fcba5; --accent-soft:#1d3329; --warn:#f0b45a; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121712; --surface:#1b221c; --fg:#e8ede7; --muted:#9aa69b; --line:#2c372d;
  --accent:#6fcba5; --accent-soft:#1d3329; --warn:#f0b45a; --warn-soft:#3a2d14; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:24px}
.wrap{max-width:860px;margin:0 auto}
h1{font-family:var(--font-display);font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.4rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;background:var(--surface);font-size:.95rem}
nav a:hover,nav a:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.day{margin-bottom:32px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.dayhead span{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:84px 1fr;gap:4px 14px}
.time{font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.time small{display:block;font-family:var(--font-body);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card>div{min-width:0}
.place{font-weight:600}
.who{color:var(--muted);margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.contact{font-size:.95rem;overflow-wrap:anywhere}
.contact b{font-weight:600}
.tbc{background:var(--warn-soft);color:var(--warn);display:inline-block;padding:2px 9px;border-radius:6px;font-size:.85rem;font-weight:600}
.driver{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.95rem}
.driver .lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.now{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.now b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.grp{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h2.list{margin-top:8px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;margin:10px 0 12px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{color:var(--muted);font-size:.85rem;margin-top:24px}
@media(max-width:480px){.card{grid-template-columns:1fr}}
</style>
</head>
<body>

  <h1>Bidar Pickup Plan</h1>

  <div class="tablebox"><table><thead><tr><th>Name</th><th>Phone / WhatsApp</th><th>Email</th></tr></thead><tbody id="rows"></tbody></table></div>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mins(t){var m=t.match(/(\d+):(\d+) (AM|PM)/),h=+m[1]%12;return (h+(m[3]=="PM"?12:0))*60+ +m[2]}
function t24(t){var m=mins(t);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}

  return '<section class="day" id="d'+d+'"><div class="dayhead"><h2>'+list[0][4]+' '+d+' October</h2><span>'+list.length+' pickups, '+total+' people</span></div>'+
  list.map(function(p){

  }).join("")+'</section>';
}).join("");
var sorted=C.slice().sort(function(a,b){return a[0].replace(/^Dr /,"").localeCompare(b[0].replace(/^Dr /,""))});

  f=(f||"").toLowerCase();

}
